{{>head.html}}

<body class="bg-xblack text-xtext font-sans antialiased flex h-screen overflow-hidden">

    {{>leftsidebar.html}}

    <main class="flex-1 border-r border-xborder h-full overflow-y-auto no-scrollbar relative">

        <header
            class="sticky top-0 bg-xblack/80 backdrop-blur-md z-20 flex items-center justify-between px-4 py-3 border-b border-xborder">

            <div class="flex items-center space-x-4">
                <a href="/profile/{{profile_handle}}" class="p-2 hover:bg-xborder/50 rounded-full transition-colors">
                    <i class="ph ph-x text-xl"></i>
                </a>

                <div>
                    <h2 class="text-xl font-bold">Edit profile</h2>
                </div>
            </div>

        </header>


        <!-- Cover Image -->
        <div class="relative">

            <div
                class="h-52 bg-gradient-to-r from-xborder/20 to-xgreen/10 w-full relative flex items-center justify-center">

                <button class="absolute bg-black/60 p-3 rounded-full hover:bg-black/80">
                    <i class="ph ph-camera text-xl"></i>
                </button>

            </div>


            <!-- Avatar -->
            <div class="px-4 relative">

                <div
                    class="-mt-16 w-32 h-32 rounded-full border-4 border-xblack bg-[#1f2224] flex items-center justify-center relative">

                    <span class="text-4xl font-bold text-xgreen">
                        {{profile_initials}}
                    </span>

                    <button class="absolute bottom-1 right-1 bg-black/70 p-2 rounded-full hover:bg-black">
                        <i class="ph ph-camera text-sm"></i>
                    </button>

                </div>

            </div>

        </div>


        <!-- Form -->
        <form action="/updateprofile" method="POST" class="px-4 py-4 space-y-5">

            <!-- Name -->
            <div class="border border-xborder rounded-lg p-3 focus-within:border-xgreen transition">

                <label class="text-xs text-xmuted">Name</label>

                <input type="text" name="fullname" value="{{profile_name}}" maxlength="50"
                    class="w-full bg-transparent outline-none text-lg" />

                <div class="text-right text-xs text-xmuted">50</div>

            </div>


            <!-- Bio -->
            <div class="border border-xborder rounded-lg p-3 focus-within:border-xgreen transition">

                <label class="text-xs text-xmuted">Bio</label>

                <textarea name="bio" rows="3" maxlength="160"
                    class="w-full bg-transparent outline-none resize-none text-[15px]">{{profile_bio}}</textarea>

                <div class="text-right text-xs text-xmuted">160</div>

            </div>


            <!-- Location -->
            <div class="border border-xborder rounded-lg p-3 focus-within:border-xgreen transition">

                <label class="text-xs text-xmuted">Location</label>

                <input type="text" name="location" value="{{profile_location}}" maxlength="30"
                    class="w-full bg-transparent outline-none" />

            </div>


            <!-- Website -->
            <div class="border border-xborder rounded-lg p-3 focus-within:border-xgreen transition">

                <label class="text-xs text-xmuted">Website</label>

                <input type="text" name="link" value="{{profile_link}}" class="w-full bg-transparent outline-none" />

            </div>


            <!-- Buttons -->
            <div class="flex justify-end space-x-3 pt-4">

                <a href="/profile/{{profile_handle}}"
                    class="border border-xborder px-5 py-2 rounded-full hover:bg-xborder/30">
                    Cancel
                </a>

                <button type="submit" class="bg-xgreen text-black font-bold px-5 py-2 rounded-full hover:bg-opacity-90">
                    Save
                </button>

            </div>

        </form>

    </main>

    {{>rightsidebar.html}}

    <script src="/static/script.js"></script>

</body>

</html>
